<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Настройки лиги · Раздел организатора</title>
<script>(function(){var r=document.documentElement,q=new URLSearchParams(location.search).get('theme'),v={};try{v=JSON.parse(localStorage.getItem('adm-view'))||{}}catch(e){}var t=q==='light'||q==='dark'?q:v.theme;if(t==='light'||t==='dark')r.dataset.theme=t;if(v.text==='large'){r.dataset.text='large';if(v.xl)r.dataset.xl='';}})();</script>
<link rel="preload" href="fonts/UbuntuSans.ttf" as="font" type="font/ttf" crossorigin>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="css/content.css">
</head>
<body class="ct-set" data-nav="settings" data-role="org">
<script>(function(){var r=new URLSearchParams(location.search).get('role');if(r==='council'||r==='admin'||r==='org'||r==='news')document.body.dataset.role=r;})();</script>
<div class="frame">
  <main class="frame-main" id="main">
    <header class="page-head">
      <div class="head-row">
        <div class="ct-titlebox">
          <h1 class="h1">Настройки лиги</h1>
        </div>
        <div class="head-act" id="act">
          <p class="who-sees"><i data-icon="eye"></i><span id="who">Игроки видят корт сразу</span></p>
          <button class="btn main" type="button" id="add"><i data-icon="plus"></i>Добавить корт</button>
        </div>
      </div>
    </header>

    <div class="work">
      <nav class="seg ct-tabs" aria-label="Разделы настроек" id="tabs">
        <a href="#courts" data-tab="courts"><i data-icon="court"></i><span>Корты<span class="ct-long"> и покрытия</span></span></a>
        <a href="#levels" data-tab="levels"><i data-icon="star"></i><span>Уровни<span class="ct-long"> и звания</span></span></a>
        <a href="#view" data-tab="view"><i data-icon="eye"></i><span>Мой вид</span></a>
      </nav>

      <!-- корты и покрытия -->
      <section class="ct-pane" id="pane-courts" aria-label="Корты и покрытия">
        <div class="with-preview">
          <div class="ct-form">
            <ul class="list ct-courts" id="court-list" aria-label="Корты"></ul>
            <button class="btn quiet preview-open" type="button" data-for="pv-courts"><i data-icon="eye"></i>Посмотреть, как увидят</button>
            <div id="where-courts"></div>
          </div>
          <aside class="preview-col" id="pv-courts" aria-label="Так корт увидят игроки"></aside>
        </div>
      </section>

      <!-- уровни и звания -->
      <section class="ct-pane" id="pane-levels" aria-label="Уровни и звания" hidden>
        <div class="with-preview">
          <div class="ct-form" id="levels-box"></div>
          <aside class="preview-col" id="pv-levels" aria-label="Так звания видят игроки"></aside>
        </div>
      </section>

      <!-- мой вид: размер текста и тема — только у вас -->
      <section class="ct-pane" id="pane-view" aria-label="Мой вид" hidden>
        <div class="ct-form ct-viewbox" id="view-box"></div>
      </section>
    </div>
  </main>
</div>
<script type="module" src="js/content.settings.js"></script>
</body>
</html>
