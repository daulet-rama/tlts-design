<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Новая новость · Раздел организатора</title>
<script>(function(){var r=document.documentElement,q=new URLSearchParams(location.search).get('theme'),v={};try{v=JSON.parse(localStorage.getItem('adm-view'))||{}}catch(e){}var t=q==='light'||q==='dark'?q:v.theme;if(t==='light'||t==='dark')r.dataset.theme=t;if(v.text==='large'){r.dataset.text='large';if(v.xl)r.dataset.xl='';}})();</script>
<link rel="preload" href="fonts/UbuntuSans.ttf" as="font" type="font/ttf" crossorigin>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="css/content.css">
</head>
<body class="ct-post" data-nav="news" data-role="org">
<div class="frame">
  <main class="frame-main" id="main">
    <header class="page-head">
      <a class="back" href="content.html"><i data-icon="back"></i>Новости и фото</a>
      <div class="head-row">
        <div class="ct-titlebox">
          <h1 class="h1" id="h1">Новая новость</h1>
          <span class="tag draft lg" id="state">Черновик — видите только вы</span>
          <span class="saved" id="saved" hidden></span>
        </div>
        <div class="head-act" id="act">
          <p class="who-sees" id="who-line"><i data-icon="eye"></i><span id="who">Увидят все: на сайте</span></p>
          <div class="ct-pub">
            <button class="btn quiet" type="button" id="unpub" hidden>Снять с публикации</button>
            <button class="btn quiet" type="button" id="revert" hidden>Вернуть опубликованное</button>
            <button class="btn main" type="button" id="pub">Опубликовать новость</button>
          </div>
          <p class="pick-msg" id="pub-msg" role="status" hidden></p>
        </div>
      </div>
    </header>

    <div class="work" id="work">
      <div class="with-preview">
        <form class="ct-form" id="form" novalidate onsubmit="return false">
          <div class="errsum" id="errsum" role="alert" tabindex="-1" hidden></div>
          <div id="fields" class="ct-form ct-fields"></div>
          <button class="btn quiet preview-open" type="button"><i data-icon="eye"></i>Посмотреть, как увидят</button>
          <section class="ct-finish" id="finish" aria-label="Публикация" data-keep-clear>
            <p class="who-sees"><i data-icon="eye"></i><span id="who2">Увидят все: на сайте</span></p>
            <div class="btns">
              <button class="btn main" type="button" id="pub2">Опубликовать новость</button>
            </div>
            <p class="pick-msg" id="pub-msg2" role="status" hidden></p>
          </section>
          <div class="ct-danger" id="danger" hidden></div>
        </form>
        <aside class="preview-col" id="pv" aria-label="Так увидят игроки"></aside>
      </div>
    </div>
  </main>
</div>
<script type="module" src="js/content.post.js"></script>
</body>
</html>
