<!doctype html>
<html lang="ru" data-layer="air">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Табло TLTS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0F1424">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TLTS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- шрифты: лежат в core/fonts/, главные файлы грузим сразу -->
<link rel="preload" href="core/fonts/commissioner-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="core/fonts/fira-sans-xcond-800i-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="core/fonts/fira-sans-xcond-900i-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="core/fonts/fira-sans-xcond-900i-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="core/theme.css">
<link rel="stylesheet" href="board.css">
</head>
<body data-layer="air" class="bd-body">
<main class="bd" id="board" aria-label="Табло">
  <div class="bd__screen" id="screen">
    <p class="bd__loading">Табло загружается…</p>
  </div>
  <div class="bd__progress" id="progress" aria-hidden="true"><i></i></div>
</main>

<div class="bd-clock" id="clock" aria-live="off">
  <b class="bd-clock__time num" id="clock-time">--:--</b>
  <span class="bd-clock__upd" id="clock-upd">обновлено только что</span>
</div>

<section class="bd-ctrl" id="ctrl" aria-label="Управление табло">
  <div class="seg" role="group" aria-label="Вид табло">
    <button type="button" class="seg__btn" data-view="court" aria-pressed="false">Корт</button>
    <button type="button" class="seg__btn" data-view="all" aria-pressed="false">Все корты</button>
    <button type="button" class="seg__btn" data-view="auto" aria-pressed="false">По кругу</button>
  </div>
  <label class="bd-ctrl__pick">
    <span class="vh">Матч на табло</span>
    <select id="pick" class="input"></select>
  </label>
  <div class="bd-ctrl__btns">
    <button type="button" class="btn btn--primary btn--sm" id="btn-demo">Запустить демо-матч</button>
    <button type="button" class="btn btn--secondary btn--sm" id="btn-reset">Сбросить демо</button>
    <button type="button" class="btn btn--quiet btn--sm" id="btn-fs">На весь экран</button>
  </div>
  <p class="bd-ctrl__hint cap" id="ctrl-hint">Панель спрячется сама. Двиньте мышью, чтобы вернуть.</p>
</section>

<script type="module" src="board.js"></script>
</body>
</html>
