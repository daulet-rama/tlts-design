<!doctype html>
<html lang="ru" data-layer="air">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Афиша матча · TLTS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0F1424">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TLTS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- шрифты: лежат в core/fonts/, главные файлы грузим сразу -->
<link rel="preload" href="core/fonts/commissioner-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="core/fonts/fira-sans-xcond-800i-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="core/fonts/fira-sans-xcond-900i-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="core/fonts/fira-sans-xcond-900i-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="core/theme.css">
<link rel="stylesheet" href="match.css">
<script>
  // Вход афиши: прячем кадр до старта анимации, чтобы готовая афиша не мелькнула до влёта.
  // Если скрипт страницы не дойдёт до анимации, match.css сам покажет афишу через 3 с.
  // Полный вход — только при первом открытии матча за сеанс (повторно — сразу готовая афиша).
  (function () {
    try {
      var q = new URLSearchParams(location.search);
      if (q.get('intro') === 'off') return;
      if (!q.has('freeze')) { try { if (sessionStorage.getItem('tlts-match-seen:' + (q.get('m') || 'm-demo-final')) === '1') return; } catch (e) { /* нет sessionStorage */ } }
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('mx-pending');
    } catch (e) { /* без анимации */ }
  })();
</script>
</head>
<body data-layer="air">
<main id="main">
  <section class="mx-air" data-layer="air" aria-labelledby="mx-title" id="air">
    <div class="wrap mx-wrap">
      <div class="mx-bar">
        <p class="cap mx-bar__crumb" id="mx-crumb">Афиша матча</p>
        <p class="mx-ctl" id="mx-ctl">
          <button type="button" class="btn btn--quiet btn--sm" id="mx-replay">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M3.2 8a4.8 4.8 0 1 0 1.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3.6 1.8v3.4H7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Повторить</span>
          </button>
          <button type="button" class="btn btn--quiet btn--sm" id="mx-skip">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M3 3.2 9 8l-6 4.8z" fill="currentColor"/><path d="M12 3v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>Пропустить</span>
          </button>
        </p>
      </div>
      <p class="mx-missing" id="mx-missing" role="status" hidden></p>
      <div class="poster mx-poster" id="poster"></div>
      <section class="mx-score" id="score" aria-labelledby="mx-score-h">
        <h2 class="vh" id="mx-score-h">Счёт матча</h2>
      </section>
    </div>
    <canvas class="mx-dust" id="mx-dust" aria-hidden="true"></canvas>
    <div class="mx-flash" id="mx-flash" aria-hidden="true"></div>
  </section>

  <div class="mx-paper mm" data-layer="paper">
    <section class="band mx-try" aria-labelledby="mx-try-h">
      <div class="wrap" id="mx-try"></div>
    </section>
    <section class="band mx-cmp" aria-labelledby="mx-cmp-h">
      <div class="wrap" id="mx-cmp"></div>
    </section>
    <section class="band mx-other" aria-labelledby="mx-other-h">
      <div class="wrap" id="mx-other"></div>
    </section>
  </div>
</main>
<script type="module" src="match.js"></script>
</body>
</html>
