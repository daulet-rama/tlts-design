<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TLTS · Варианты дизайна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
  :root { --bg: #0e1a14; --fg: #eef2ec; --muted: #a9b8ad; --accent: #d9a35b; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 40rem; display: grid; gap: 1rem; padding-block: 3rem; }
  .eyebrow { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.05; font-weight: 800; text-wrap: balance; }
  p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 1.05rem; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Теннисная Лига TS · концепты</div>
  <h1>Пять вариантов дизайна нового сайта собираются</h1>
  <p>На этой странице появятся пять стилей. В каждом будет главная и страница турнира с 3D. Это рабочие макеты для обсуждения, а не официальный сайт лиги.</p>
</main>
</body>
</html>
