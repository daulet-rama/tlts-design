<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Июньский кубок · Теннисная лига</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;})();</script>
<link rel="preload" href="fonts/UbuntuSans.ttf" as="font" type="font/ttf" crossorigin>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="css/tour.css">
<!-- вкладка «Фото» (стена альбома, просмотр, четыре вкладки в строку): css/news.css; ставит её js/tour.js, если альбом этапа показан -->
<link rel="stylesheet" href="css/news.css">
</head>
<body data-page="tournament" data-dock="none" class="tour-page">
<main class="app">
  <header class="surface bleed tp-head" id="head" data-surface="clay">
    <div class="navbar">
      <a class="icon-btn glass" href="tournaments.html" aria-label="Назад" data-step-back><i data-icon="back" style="display:contents"></i></a>
      <div class="t"><span class="cap" id="head-cap"></span></div>
      <button class="icon-btn glass" type="button" id="share" aria-label="Поделиться" data-share><i data-icon="share" style="display:contents"></i></button>
    </div>
    <div class="tp-body" id="head-body"></div>
    <div class="court-line" aria-hidden="true"></div>
  </header>

  <nav class="tabs glass stick on-edge" aria-label="Разделы турнира" id="tabs">
    <a href="#setka" data-tab="setka" aria-current="true">Сетка</a>
    <a href="#gruppy" data-tab="gruppy">Группы</a>
    <a href="#raspisanie" data-tab="raspisanie">Расписание</a>
  </nav>

  <div class="tp-pane" id="pane-setka" aria-label="Сетка"></div>
  <div class="tp-pane" id="pane-gruppy" aria-label="Группы" hidden></div>
  <div class="tp-pane" id="pane-raspisanie" aria-label="Расписание" hidden></div>
</main>

<!-- шторка «Как считаются места» -->
<div class="scrim" id="rules-scrim" hidden></div>
<div class="bsheet float tall tp-rules" id="rules" role="dialog" aria-labelledby="rules-t" tabindex="-1" hidden>
  <span class="handle"></span>
  <div class="title" id="rules-t">Как считаются места</div>
  <p class="lead" id="rules-lead"></p>
  <div class="scroll" id="rules-body"></div>
  <button class="btn quiet" type="button" id="rules-close">Понятно</button>
</div>

<script type="module" src="app.js"></script>
<script type="module" src="js/tour.js"></script>
</body>
</html>
