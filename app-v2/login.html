<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Вход · Теннисная лига</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;})();</script>
<link rel="preload" href="fonts/UbuntuSans.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="img/join-cover.webp" as="image">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="css/join.css">
<link rel="stylesheet" href="css/me.css">
</head>
<body data-page="login" data-dock="none" class="jn jn-login">
<main class="app">
  <!-- под шторкой — обложка лиги с первого экрана -->
  <figure class="poster jn-cover jn-under" aria-hidden="true">
    <img src="img/join-cover.webp" alt="">
  </figure>
  <div class="scrim" data-scrim></div>
  <a class="icon-btn glass jn-close" href="welcome.html" aria-label="Закрыть" data-back><i data-icon="close" style="display:contents"></i></a>

  <section class="bsheet float jn-sheet" role="dialog" aria-modal="true" aria-labelledby="jn-login-h">
    <span class="handle"></span>

    <!-- шаг 1: почта, Apple, Google -->
    <div class="jn-pane" data-pane="email">
      <h1 class="title" id="jn-login-h" data-h>Вход по почте</h1>
      <p class="lead" data-lead>Пришлём код из шести цифр. Аккаунта ещё нет — создадим.</p>
      <form data-email-form novalidate>
        <label class="field" data-email-field>
          <span class="cap">Почта</span>
          <input class="input" type="email" name="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="name@example.com" required>
          <span class="hint" data-email-hint hidden>Проверьте адрес почты</span>
        </label>
        <!-- пробная версия (?trial): код от организатора — пока его нет на телефоне; согласие обязательно -->
        <label class="field jn-trial-code" data-trial-field hidden>
          <span class="cap">Код пробной версии</span>
          <input class="input" type="text" name="trial" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="jn-trial-hint">
          <span class="hint" id="jn-trial-hint" data-trial-hint>Его даёт организатор лиги</span>
        </label>
        <div class="jn-agree" data-agree hidden>
          <label class="jn-agree-row">
            <span class="grow"><span class="jn-agree-t">Мне есть 18 лет, согласен на хранение данных пробной версии</span>
              <span class="jn-agree-err" data-agree-err hidden>Без согласия аккаунт не создать</span></span>
            <input class="switch" type="checkbox" name="agree">
          </label>
          <button class="jn-what tap-area" type="button" data-what aria-haspopup="dialog">Что хранится</button>
        </div>
        <button class="btn main jn-send" type="submit">Получить код</button>
        <p class="jn-form-say" data-form-say role="alert" hidden></p>
      </form>
      <div data-alt>
      <span class="cap jn-or">или</span>
      <div class="jn-alt" role="group" aria-label="Другие способы входа">
        <button class="btn quiet" type="button" data-provider="apple">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.15 6.9c-.95 0-2.41-1.08-3.96-1.04-2.04.03-3.91 1.18-4.96 3.01-2.12 3.68-.55 9.1 1.52 12.09 1.01 1.45 2.2 3.09 3.79 3.04 1.52-.07 2.09-.99 3.93-.99 1.83 0 2.35.99 3.96.95 1.64-.03 2.68-1.48 3.68-2.95 1.15-1.69 1.63-3.33 1.66-3.42-.04-.01-3.18-1.22-3.22-4.86-.03-3.04 2.48-4.49 2.6-4.56-1.43-2.09-3.63-2.32-4.39-2.38-2-.15-3.68 1.09-4.61 1.09zm3.38-3.07c.84-1.01 1.4-2.43 1.24-3.83-1.2.05-2.66.8-3.53 1.82-.78.9-1.45 2.34-1.27 3.71 1.34.1 2.71-.69 3.56-1.7z"/></svg>
          <span>Войти через Apple</span>
        </button>
        <button class="btn quiet" type="button" data-provider="google">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.85 3.19-1.79 4.13-1.15 1.15-2.93 2.4-6.05 2.4-4.83 0-8.6-3.89-8.6-8.72s3.77-8.72 8.6-8.72c2.6 0 4.51 1.03 5.91 2.35l2.3-2.31C18.75 1.44 16.13 0 12.48 0 5.87 0 .31 5.39.31 12s5.56 12 12.17 12c3.57 0 6.27-1.17 8.37-3.36 2.16-2.16 2.84-5.21 2.84-7.67 0-.76-.05-1.47-.17-2.05H12.48z"/></svg>
          <span>Войти через Google</span>
        </button>
      </div>
      </div>
    </div>

    <!-- шаг 2: код из письма; в пробной версии — «Код входа» и код на экране -->
    <div class="jn-pane" data-pane="code" hidden>
      <h1 class="title" data-code-h>Код из письма</h1>
      <p class="lead" data-code-lead>Отправили на <b class="jn-mail" data-email-out>почту</b></p>
      <div class="otp" data-code>
        <span class="otp-cell" aria-hidden="true"><span class="hero-num"></span></span>
        <span class="otp-cell" aria-hidden="true"><span class="hero-num"></span></span>
        <span class="otp-cell" aria-hidden="true"><span class="hero-num"></span></span>
        <span class="otp-cell" aria-hidden="true"><span class="hero-num"></span></span>
        <span class="otp-cell" aria-hidden="true"><span class="hero-num"></span></span>
        <span class="otp-cell" aria-hidden="true"><span class="hero-num"></span></span>
        <input class="otp-in" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" aria-label="Код из письма, шесть цифр" data-code-in>
      </div>
      <p class="jn-code-say" data-code-say aria-live="polite">&nbsp;</p>
      <div class="jn-resend">
        <span class="muted" data-timer>Новый код через 0:59</span>
        <button class="btn quiet small" type="button" data-resend hidden>Отправить ещё раз</button>
        <button class="btn small ghost" type="button" data-change>Изменить почту</button>
      </div>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
<script type="module" src="js/join.js"></script>
</body>
</html>
