<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Итог матча · Судья · Теннисная лига</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;})();</script>
<link rel="preload" href="fonts/UbuntuSans.ttf" as="font" type="font/ttf" crossorigin>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="css/judge.css">
</head>
<body data-page="judge-end" data-dock="none" class="sun jd jd-end">
<main class="app">
  <header class="navbar no-action">
    <a class="icon-btn glass" id="back" href="judge-list.html" aria-label="Мои матчи"><i data-icon="back" style="display:contents"></i></a>
    <div class="t"><span class="cap" id="where">Корт</span><span class="strong">Итог матча</span></div>
    <span aria-hidden="true"></span>
  </header>

  <!-- итог на тёмном табло: снизу свет покрытия корта, где играли -->
  <article class="obj grain jd-board" id="final" aria-live="polite"></article>

  <section class="section">
    <div class="sec-head"><span class="cap" id="okCap">Счёт подтверждают</span><span class="cap" id="okN"></span></div>
    <div class="card" id="oks"></div>
    <button class="btn quiet jd-fix" id="fix" type="button"><i data-icon="edit" style="display:contents"></i><span id="fixLabel">Исправить счёт</span></button>
  </section>

  <div class="cta">
    <span class="wait" id="wait" aria-live="polite" hidden></span>
    <button class="btn main" id="send" type="button" disabled></button>
  </div>
</main>

<!-- исправление счёта -->
<div class="scrim" id="scrim" hidden></div>
<div class="bsheet float" id="sheet" role="dialog" aria-labelledby="fixTitle" hidden>
  <span class="handle"></span>
  <div class="title" id="fixTitle">Исправить счёт</div>
  <p class="lead" id="fixLead"></p>
  <div class="jd-steps" id="steppers"></div>
  <p class="jd-then" id="fixMsg" aria-live="polite"></p>
  <button class="btn main" id="fixOk" type="button">Сохранить</button>
  <button class="btn quiet jd-back" id="fixNo" type="button">Отмена</button>
</div>

<script type="module" src="app.js"></script>
<script type="module" src="js/judge.end.js"></script>
</body>
</html>
