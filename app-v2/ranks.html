<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Лестница званий · Теннисная лига</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;})();</script>
<link rel="preload" href="fonts/UbuntuSans.ttf" as="font" type="font/ttf" crossorigin>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="css/rating.css">
</head>
<body data-page="ranks" data-dock="none" class="rk-page">
<main class="app">
  <header class="navbar no-action">
    <a class="icon-btn glass" href="rating.html" aria-label="Назад" data-step-back><i data-icon="back" style="display:contents"></i></a>
    <div class="t"><span class="cap">Лига TS</span><span class="strong">Лестница званий</span></div>
  </header>

  <section class="obj grain rk-hero" aria-labelledby="rk-name">
    <span class="cap">Ваше звание</span>
    <div class="rk-num"><span class="hero-num" id="rk-level"></span><span class="num" id="rk-of"></span></div>
    <div class="title" id="rk-name"></div>
    <p class="strong rk-say" id="say"></p>
    <p class="rk-say2" id="say2" hidden></p>
    <div class="rk-stairs" id="stairs"></div>
    <div class="court-line rk-ground" aria-hidden="true"></div>
    <div class="rk-nums" id="nums" aria-hidden="true"></div>
  </section>

  <section class="section" id="next-sec">
    <span class="cap" id="next-cap"></span>
    <div class="mt-list" id="next"></div>
  </section>

  <section class="section">
    <div class="sec-head"><span class="cap">Все звания</span><span class="cap">Звание не падает</span></div>
    <ol class="card steps rk-steps" id="steps"></ol>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>
<div class="bsheet float tall" id="sheet" role="dialog" aria-labelledby="sheet-t" hidden>
  <span class="handle"></span>
  <div class="title" id="sheet-t"></div>
  <p class="lead" id="sheet-lead"></p>
  <div class="scroll" id="people"></div>
  <button class="btn quiet" type="button" id="close">Закрыть</button>
</div>

<script type="module" src="app.js"></script>
<script type="module" src="js/rating.ranks.js"></script>
</body>
</html>
