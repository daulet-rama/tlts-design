<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Сегодня · Теннисная лига</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;})();</script>
<link rel="preload" href="fonts/UbuntuSans.ttf" as="font" type="font/ttf" crossorigin>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="css/news.css">
</head>
<body data-page="today" data-dock="today" class="today">
<main class="app">
  <header class="topbar">
    <div>
      <div class="cap">Суббота, 19 июня</div>
      <h1 class="title">Сегодня</h1>
    </div>
    <a class="ava-btn" href="player.html" aria-label="Мой профиль"><img src="img/d03-sm.webp" alt=""></a>
  </header>

  <a class="live-card glass grain" href="match.html" aria-label="Идёт матч за 3-е место, открыть">
    <div class="live-head">
      <span class="dot"></span><span class="cap">Идёт · Корт 3</span>
      <span class="go"><span class="cap">За 3-е место</span><i data-icon="chev" style="display:contents"></i></span>
    </div>
    <div class="score-line">
      <div class="side" data-side="0">
        <div class="hero-num"><span class="tick" data-games>4</span><i data-ball="glow"></i></div>
        <div class="names">Громов<br>Юсупов</div>
      </div>
      <div class="pts-chip now" aria-label="Очки в гейме"><span class="num tick" data-p="0">30</span><span class="num sep" aria-hidden="true">:</span><span class="num tick" data-p="1">15</span></div>
      <div class="side" data-side="1">
        <div class="hero-num"><i data-ball="glow"></i><span class="tick" data-games>3</span></div>
        <div class="names">Назаров<br>Гасанов</div>
      </div>
    </div>
    <p class="live-say" data-say>&nbsp;</p>
  </a>

  <section class="section" id="t">
    <span class="cap">Ваш матч</span>
    <a class="poster" href="match-soon.html?m=final">
      <img src="img/poster-ball.jpg" alt="" fetchpriority="high">
      <span class="tag">Финал · Корт 1</span>
      <span class="foot">
        <span>
          <span class="cap ellipsis">Вы с Орловым · против</span>
          <span class="strong ellipsis">Оспанов / Савельев</span>
        </span>
        <span class="num">20:00</span>
      </span>
    </a>
  </section>

  <section class="section" id="r">
    <div class="sec-head"><span class="cap">Рейтинг лиги</span><a class="cap tap-area" href="rating.html">Весь</a></div>
    <div class="card">
      <a class="row rank-row" href="player-other.html?p=p16"><span class="num place muted">16</span><span class="grow strong ellipsis">Тимур Ахметов</span><span class="pts">1 655</span></a>
      <a class="row rank-row me" href="player.html"><span class="num place">17</span><span class="grow strong ellipsis">Вы · Герман Хван</span><span class="pts">1 620</span></a>
      <a class="row rank-row" href="player-other.html?p=p18"><span class="num place muted">18</span><span class="grow strong ellipsis">Дамир Назаров</span><span class="pts">1 590</span></a>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
<!-- «Новости лиги» — последний блок, после рейтинга (#r): js/news.js ставит его сам, id="news"; ?news=0 — свежего нет, блока нет -->
<script type="module" src="js/news.js"></script>
</body>
</html>
