<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Матч · Теннисная лига</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;})();</script>
<link rel="preload" href="fonts/UbuntuSans.ttf" as="font" type="font/ttf" crossorigin>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="glass.css">
</head>
<body data-page="match" data-dock="none" class="match-page">
<main class="app">
  <div class="behind" aria-hidden="true"></div>
  <article class="sheet">
    <header class="court-head grain" id="score">
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-bar">
        <a class="icon-btn glass" href="index.html" aria-label="Закрыть" data-step-back><i data-icon="close" style="display:contents"></i></a>
        <div class="cap">Матч за 3-е место<br>Корт 3 · грунт</div>
        <button class="icon-btn glass" type="button" aria-label="Поделиться" aria-haspopup="dialog" data-share><i data-icon="share" style="display:contents"></i></button>
      </div>

      <section class="match-hero">
        <span class="live-pill glass"><span class="dot"></span><span class="cap">Идёт · <span data-clock>47:12</span></span></span>
        <p class="say" data-say>&nbsp;</p>
        <div class="score-line">
          <div class="side" data-side="0">
            <div class="hero-num"><span class="tick" data-games>4</span><i data-ball="glow"></i></div>
            <div class="pair"><img src="img/d02-sm.webp" alt=""><img src="img/d06-sm.webp" alt=""></div>
            <div class="names">Громов<br>Юсупов</div>
          </div>
          <div class="pts-chip now" aria-label="Очки в гейме"><span class="num tick" data-p="0">30</span><span class="num sep" aria-hidden="true">:</span><span class="num tick" data-p="1">15</span></div>
          <div class="side" data-side="1">
            <div class="hero-num"><i data-ball="glow"></i><span class="tick" data-games>3</span></div>
            <div class="pair"><img src="img/d08-sm.webp" alt=""><img src="img/d07-sm.webp" alt=""></div>
            <div class="names">Назаров<br>Гасанов</div>
          </div>
        </div>
      </section>
      <div class="court-line" aria-hidden="true"></div>
    </header>

    <nav class="seg glass" aria-label="Разделы матча">
      <a href="#score" aria-current="true">Счёт</a>
      <a href="#feed">Лента</a>
      <a href="#stats">Цифры</a>
    </nav>

    <section class="section">
      <div class="card record">
        <div class="record-head"><span class="cap">Один сет до 6</span><span class="cap">Сет</span><span class="cap">Очки</span></div>
        <div class="record-row" data-row="0"><span class="who"><span class="n">Громов / Юсупов</span><i data-ball></i></span><span class="num" data-g>4</span><span class="num pts" data-pt>30</span></div>
        <div class="record-row" data-row="1"><span class="who"><span class="n">Назаров / Гасанов</span><i data-ball></i></span><span class="num" data-g>3</span><span class="num pts" data-pt>15</span></div>
      </div>
    </section>

    <section class="section" id="feed">
      <span class="cap">Лента</span>
      <div class="card feed" aria-live="polite"></div>
    </section>

    <section class="section" id="stats">
      <span class="cap">Цифры</span>
      <div class="card stats-card"></div>
    </section>

    <section class="section" id="flow">
      <span class="cap">Ход сета</span>
      <div class="card flow">
        <div class="flow-grid"></div>
        <p class="flow-say">&nbsp;</p>
      </div>
    </section>

    <section class="section" id="h2h">
      <span class="cap">Личные встречи</span>
      <div class="card row">
        <span class="num">0–1</span>
        <span class="grow muted">Майский кубок, группа A · 5:7</span>
      </div>
    </section>
  </article>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
