<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Пульт судьи · Теннисная лига</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;})();</script>
<link rel="preload" href="fonts/UbuntuSans.ttf" as="font" type="font/ttf" crossorigin>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="glass.css">
</head>
<body data-page="judge" data-dock="none" class="judge-page">
<main class="app">
  <header class="judge-bar">
    <a class="back glass" href="judge-list.html"><i data-icon="back" style="display:contents"></i>Выйти</a>
    <div class="where"><div class="cap">Корт 3 · сет до 6</div></div>
  </header>

  <div class="keys">
    <button class="key" data-side="0" aria-label="Очко паре Громов / Юсупов">
      <span class="flash"></span>
      <span class="top"><span class="who">Громов / Юсупов</span><i data-ball="glow"></i></span>
      <span class="bottom"><span class="hero-num tick" data-pts>30</span><span class="adv"><span class="cap">Больше</span></span><span class="plus" aria-hidden="true"><i data-icon="plus" style="display:contents"></i></span></span>
    </button>

    <div class="games-float glass glass-strong" aria-live="polite">
      <span class="num" data-g="0">4</span><span class="cap">геймы</span><span class="decide"><span class="cap">Решающее очко</span></span><span class="num" data-g="1">3</span>
      <span class="msg"></span>
    </div>

    <button class="key" data-side="1" aria-label="Очко паре Назаров / Гасанов">
      <span class="flash"></span>
      <span class="top"><span class="who">Назаров / Гасанов</span><i data-ball="glow"></i></span>
      <span class="bottom"><span class="hero-num tick" data-pts>15</span><span class="adv"><span class="cap">Больше</span></span><span class="plus" aria-hidden="true"><i data-icon="plus" style="display:contents"></i></span></span>
    </button>
  </div>

  <footer class="judge-foot">
    <button class="undo"><i data-icon="undo" style="display:contents"></i>Отмена <span class="muted"></span></button>
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
